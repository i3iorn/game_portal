name: Release

on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]'
      - 'v[0-9].[0-9].[0-9]-**'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]{1,5})?$'; then
            echo "::error::Tag '${tag}' does not match v<digits>.<digits>.<digits>(-suffix)"
            exit 1
          fi
          version="${tag#v}"
          version="${version%%-*}"
          IFS=. read -r major minor patch <<< "$version"
          echo "version_name=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PROPERTIES != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "keystore/$(echo "$KEYSTORE_PROPERTIES" | grep '^storeFile=' | cut -d= -f2)"
          echo "$KEYSTORE_PROPERTIES" > keystore/keystore.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --console=plain assembleRelease
          -PappVersionName="${{ steps.tag.outputs.version_name }}"
          -PappVersionCode="${{ steps.tag.outputs.version_code }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
