name: Release

on:
  push:
    tags:
      - 'v[0-9].[0-9].[0-9]'
      - 'v[0-9].[0-9].[0-9]-**'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]\.[0-9]\.[0-9](-[a-z0-9]{1,5})?$'; then
            echo "::error::Tag '${tag}' does not match v<digits>.<digits>.<digits>(-suffix)"
            exit 1
          fi
          version="${tag#v}"
          version="${version%%-*}"
          IFS=. read -r major minor patch <<< "$version"
          echo "version_name=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --console=plain assembleRelease
          -PappVersionName="${{ steps.tag.outputs.version_name }}"
          -PappVersionCode="${{ steps.tag.outputs.version_code }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
